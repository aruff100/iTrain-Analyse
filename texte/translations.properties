ergebnis.schritt1.de=1. Dateien in den Chat ziehen
ergebnis.schritt1.en=1. Drag the files into the chat
ergebnis.schritt1.nl=1. Bestanden naar de chat slepen
ergebnis.schritt1.fr=1. Glisser les fichiers dans le chat
ergebnis.schritt1.es=1. Arrastrar los archivos al chat
ergebnis.schritt1.it=1. Trascinare i file nella chat

ergebnis.schritt1.text.de=Öffnen Sie in Ihrem KI-Assistenten einen neuen, leeren Chat. Ziehen Sie den blauen Kasten mit der Maus in das Nachrichtenfeld; so kommen alle Dateien auf einmal mit. Einzelne Dateien lassen sich ebenso ziehen. Alternativ im Nachrichtenfeld Strg+V drücken.
ergebnis.schritt1.text.en=Open a new, empty chat in your AI assistant. Drag the blue box with the mouse into the message field; this brings all files at once. Single files can be dragged the same way. Alternatively press Ctrl+V in the message field.
ergebnis.schritt1.text.nl=Open in uw AI-assistent een nieuwe, lege chat. Sleep het blauwe vak met de muis naar het berichtveld; zo komen alle bestanden in één keer mee. Losse bestanden kunt u op dezelfde manier slepen. U kunt ook Ctrl+V in het berichtveld drukken.
ergebnis.schritt1.text.fr=Ouvrez un nouveau chat vide dans votre assistant IA. Faites glisser le cadre bleu dans le champ de message ; tous les fichiers sont ainsi joints en une fois. Les fichiers isolés peuvent être glissés de la même manière. Vous pouvez aussi appuyer sur Ctrl+V dans le champ de message.
ergebnis.schritt1.text.es=Abra un chat nuevo y vacío en su asistente de IA. Arrastre el recuadro azul con el ratón al campo de mensaje; así se adjuntan todos los archivos a la vez. Los archivos sueltos se pueden arrastrar igual. También puede pulsar Ctrl+V en el campo de mensaje.
ergebnis.schritt1.text.it=Aprite una nuova chat vuota nel vostro assistente IA. Trascinate il riquadro blu con il mouse nel campo del messaggio; così vengono allegati tutti i file insieme. I singoli file si trascinano allo stesso modo. In alternativa premere Ctrl+V nel campo del messaggio.

