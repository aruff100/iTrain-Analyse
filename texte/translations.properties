kurz.h.token.it=Consumo di token
kurz.token.de=Die KI bekommt das Ergebnis der Kurzprüfung als Datei und muss diese Prüfungen nicht selbst rechnen. Vom Handbuch bekommt sie nur die Seiten, die sie als Quelle braucht. Beides senkt den Token-Verbrauch.
kurz.token.en=The AI receives the result of the quick check as a file and does not have to calculate these checks itself. Of the manual it receives only the pages it needs as sources. Both reduce the token consumption.
kurz.token.nl=De AI krijgt het resultaat van de snelle controle als bestand en hoeft deze controles niet zelf te berekenen. Van de handleiding krijgt zij alleen de pagina's die zij als bron nodig heeft. Beide verlagen het tokenverbruik.
kurz.token.fr=L'IA reçoit le résultat du contrôle rapide sous forme de fichier et n'a pas à calculer elle-même ces contrôles. Du manuel, elle ne reçoit que les pages dont elle a besoin comme sources. Les deux réduisent la consommation de tokens.
kurz.token.es=La IA recibe el resultado de la comprobación rápida como archivo y no tiene que calcular ella misma estas comprobaciones. Del manual solo recibe las páginas que necesita como fuente. Ambas cosas reducen el consumo de tokens.
kurz.token.it=L'IA riceve il risultato della verifica rapida come file e non deve calcolare da sé queste verifiche. Del manuale riceve solo le pagine che le servono come fonte. Entrambe le cose riducono il consumo di token.
kurz.wieWeiter.de=„Fertig“ beendet hier mit der Kurzprüfung. „Weiter zur KI-Analyse“ führt Schritt für Schritt zum Paket für Ihren KI-Assistenten.
kurz.wieWeiter.en=“Done” ends here with the quick check. “Continue to AI analysis” leads you step by step to the package for your AI assistant.
kurz.wieWeiter.nl=„Klaar” stopt hier met de snelle controle. „Verder naar AI-analyse” leidt u stap voor stap naar het pakket voor uw AI-assistent.
kurz.wieWeiter.fr=« Terminé » s'arrête ici avec le contrôle rapide. « Continuer vers l'analyse IA » vous mène étape par étape au paquet pour votre assistant IA.
kurz.wieWeiter.es=«Terminado» termina aquí con la comprobación rápida. «Continuar al análisis con IA» le lleva paso a paso al paquete para su asistente de IA.
kurz.wieWeiter.it=«Fine» termina qui con la verifica rapida. «Avanti all'analisi IA» vi porta passo dopo passo al pacchetto per il vostro assistente IA.
