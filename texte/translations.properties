feld.auftragLeer.it=ad es. Verifica perché il relè R12 non commuta quando un treno entra nel blocco B3.

feld.auftragHinweis.de=Was die KI zusätzlich zur Analyse untersuchen soll, z. B. ein Relais, den Ablauf einer Aktion oder ein Problem aus dem Forum. Der Text wird der Nachricht an die KI angefügt; die Antwort steht vorne im Analysedokument. Leer lassen, wenn nichts Besonderes zu prüfen ist.
feld.auftragHinweis.en=What the AI should examine in addition to the analysis, e.g. a relay, the sequence of an action or a problem from the forum. The text is added to the message for the AI; the answer appears at the front of the analysis document. Leave empty if there is nothing special to check.
feld.auftragHinweis.nl=Wat de AI naast de analyse moet onderzoeken, bijv. een relais, het verloop van een actie of een probleem uit het forum. De tekst wordt aan het bericht voor de AI toegevoegd; het antwoord staat vooraan in het analysedocument. Leeg laten als er niets bijzonders te controleren is.
feld.auftragHinweis.fr=Ce que l'IA doit examiner en plus de l'analyse, par ex. un relais, le déroulement d'une action ou un problème du forum. Le texte est ajouté au message pour l'IA ; la réponse figure au début du document d'analyse. Laisser vide s'il n'y a rien de particulier à vérifier.
feld.auftragHinweis.es=Lo que la IA debe examinar además del análisis, p. ej. un relé, el desarrollo de una acción o un problema del foro. El texto se añade al mensaje para la IA; la respuesta aparece al principio del documento de análisis. Déjelo vacío si no hay nada especial que comprobar.
feld.auftragHinweis.it=Che cosa l'IA deve esaminare oltre all'analisi, ad es. un relè, lo svolgimento di un'azione o un problema del forum. Il testo viene aggiunto al messaggio per l'IA; la risposta compare all'inizio del documento di analisi. Lasciare vuoto se non c'è nulla di particolare da verificare.

