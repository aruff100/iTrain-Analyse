dialog.kurzFertig.titel.de=Nur Kurzprüfung
dialog.kurzFertig.titel.en=Quick check only
dialog.kurzFertig.titel.nl=Alleen snelle controle
dialog.kurzFertig.titel.fr=Contrôle rapide seulement
dialog.kurzFertig.titel.es=Solo comprobación rápida
dialog.kurzFertig.titel.it=Solo verifica rapida
dialog.kurzFertig.text.de=Die Kurzprüfung ist nur eine oberflächliche Prüfung nach festen Regeln. Sie kann Fehler machen, zum Beispiel bei der Fahrtrichtung in Routen, die sie nur „vermutlich“ bewerten kann. Aktionen, Zusammenhänge und Signale prüft sie gar nicht. Für eine verlässliche Beurteilung reicht sie nicht aus; dafür ist die ausführliche Analyse mit KI gedacht.
dialog.kurzFertig.text.en=The quick check is only a superficial check according to fixed rules. It can make mistakes, for example with the direction of travel in routes, which it can only rate as “probably”. It does not check actions, relationships and signals at all. It is not sufficient for a reliable assessment; that is what the detailed analysis with AI is for.
dialog.kurzFertig.text.nl=De snelle controle is alleen een oppervlakkige controle volgens vaste regels. Ze kan fouten maken, bijvoorbeeld bij de rijrichting in routes, die ze alleen als „vermoedelijk” kan beoordelen. Acties, samenhang en seinen controleert ze helemaal niet. Voor een betrouwbare beoordeling is ze niet voldoende; daarvoor is de uitgebreide analyse met AI bedoeld.
dialog.kurzFertig.text.fr=Le contrôle rapide n'est qu'une vérification superficielle selon des règles fixes. Il peut se tromper, par exemple sur le sens de marche dans les itinéraires, qu'il ne peut évaluer que comme « probable ». Il ne vérifie pas du tout les actions, les liens ni les signaux. Il ne suffit pas pour une évaluation fiable ; l'analyse détaillée avec IA est prévue pour cela.
dialog.kurzFertig.text.es=La comprobación rápida es solo una comprobación superficial según reglas fijas. Puede equivocarse, por ejemplo en el sentido de marcha de las rutas, que solo puede valorar como «probable». No comprueba en absoluto acciones, relaciones ni señales. No basta para una valoración fiable; para eso está el análisis detallado con IA.
dialog.kurzFertig.text.it=La verifica rapida è solo un controllo superficiale secondo regole fisse. Può sbagliare, ad esempio sul senso di marcia nei percorsi, che può valutare solo come «probabile». Non verifica affatto azioni, relazioni e segnali. Non basta per una valutazione affidabile; a questo serve l'analisi dettagliata con IA.
