ki.einleitung1.de=Wählen Sie die Sprache des Prompts. Im Direktmodus stellt die KI keine Rückfragen und liefert alles in einer Antwort; dann legen Sie hier Sprache, Format und die Zusätze fest. Ohne Direktmodus fragt die KI danach im Chat.
ki.einleitung1.en=Choose the language of the prompt. In direct mode the AI asks no questions and delivers everything in one reply; then you set language, format and extras here. Without direct mode the AI asks for them in the chat.
ki.einleitung1.nl=Kies de taal van de prompt. In de directe modus stelt de AI geen vragen en levert alles in één antwoord; dan legt u hier taal, formaat en aanvullingen vast. Zonder directe modus vraagt de AI daarnaar in de chat.
ki.einleitung1.fr=Choisissez la langue du prompt. En mode direct, l'IA ne pose aucune question et fournit tout en une réponse ; vous fixez alors ici la langue, le format et les compléments. Sans mode direct, l'IA les demande dans le chat.
ki.einleitung1.es=Elija el idioma del prompt. En modo directo la IA no hace preguntas y entrega todo en una respuesta; entonces fija aquí idioma, formato y complementos. Sin modo directo, la IA los pregunta en el chat.
ki.einleitung1.it=Scegliete la lingua del prompt. In modalità diretta l'IA non fa domande e fornisce tutto in una risposta; allora impostate qui lingua, formato e supplementi. Senza modalità diretta l'IA li chiede nella chat.
ki.einleitung2.de=Hier können Sie der KI eine eigene Frage stellen und einen Beitrag aus dem iTrain-Forum mitgeben. Beides ist freiwillig; lassen Sie die Felder leer, wenn nichts Besonderes zu prüfen ist.
ki.einleitung2.en=Here you can ask the AI a question of your own and include a post from the iTrain forum. Both are optional; leave the fields empty if there is nothing special to check.
ki.einleitung2.nl=Hier kunt u de AI een eigen vraag stellen en een bericht uit het iTrain-forum meegeven. Beide zijn vrijwillig; laat de velden leeg als er niets bijzonders te controleren is.
ki.einleitung2.fr=Ici, vous pouvez poser votre propre question à l'IA et joindre un message du forum iTrain. Les deux sont facultatifs ; laissez les champs vides s'il n'y a rien de particulier à vérifier.
ki.einleitung2.es=Aquí puede hacer a la IA una pregunta propia y añadir una entrada del foro de iTrain. Ambas cosas son opcionales; deje los campos vacíos si no hay nada especial que comprobar.
ki.einleitung2.it=Qui potete porre all'IA una domanda vostra e allegare un messaggio del forum iTrain. Entrambi sono facoltativi; lasciate vuoti i campi se non c'è nulla di particolare da verificare.
ki.einleitung3.de=„Zusammenstellen“ legt Prompt, Layout-Datei, Kurzprüfung, Handbuch-Auszug, Release Notes und Prüfbericht in den Arbeitsordner und zeigt unten den Fortschritt. Es wird noch nichts in die Zwischenablage gelegt.\n„Ausführen“ legt danach das Paket in die Zwischenablage und öffnet das Fenster, aus dem Sie die Dateien in den Chat ziehen.
ki.einleitung3.en=“Assemble” puts prompt, layout file, quick check, manual excerpt, release notes and check report into the working folder and shows the progress below. Nothing is put into the clipboard yet.\n“Run” then puts the package into the clipboard and opens the window from which you drag the files into the chat.
ki.einleitung3.nl=„Samenstellen” zet prompt, layoutbestand, snelle controle, uittreksel van de handleiding, release notes en controlerapport in de werkmap en toont hieronder de voortgang. Er gaat nog niets naar het klembord.\n„Uitvoeren” zet daarna het pakket op het klembord en opent het venster waaruit u de bestanden naar de chat sleept.
ki.einleitung3.fr=« Assembler » dépose le prompt, le fichier de réseau, le contrôle rapide, l'extrait du manuel, les notes de version et le rapport de contrôle dans le dossier de travail et affiche la progression ci-dessous. Rien n'est encore mis dans le presse-papiers.\n« Exécuter » met ensuite le paquet dans le presse-papiers et ouvre la fenêtre depuis laquelle vous glissez les fichiers dans le chat.
ki.einleitung3.es=«Reunir» deja el prompt, el archivo de maqueta, la comprobación rápida, el extracto del manual, las notas de la versión y el informe en la carpeta de trabajo y muestra abajo el progreso. Todavía no se copia nada al portapapeles.\n«Ejecutar» copia después el paquete al portapapeles y abre la ventana desde la que arrastra los archivos al chat.
ki.einleitung3.it=«Prepara» mette prompt, file del plastico, verifica rapida, estratto del manuale, note di rilascio e rapporto di verifica nella cartella di lavoro e mostra sotto l'avanzamento. Non viene ancora copiato nulla negli appunti.\n«Esegui» copia poi il pacchetto negli appunti e apre la finestra da cui trascinate i file nella chat.
