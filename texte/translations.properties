vor.arbeitsordnerHinweis.de=Je Layout entsteht darin ein Unterordner mit den Dateien für den Chat; er wird bei jedem Zusammenstellen neu befüllt. Im Unterordner .cache liegen Prompt, Handbuch-PDF und Handbuch-Text; sie werden bei der nächsten Analyse wiederverwendet.
vor.arbeitsordnerHinweis.en=For each layout a subfolder with the files for the chat is created; it is refilled each time. The subfolder .cache holds the prompt, the manual PDF and the manual text; they are reused for the next analysis.
vor.arbeitsordnerHinweis.nl=Per layout ontstaat een submap met de bestanden voor de chat; die wordt elke keer opnieuw gevuld. In de submap .cache staan prompt, handleiding-PDF en handleidingtekst; ze worden bij de volgende analyse hergebruikt.
vor.arbeitsordnerHinweis.fr=Pour chaque réseau, un sous-dossier contenant les fichiers pour le chat est créé ; il est rempli à chaque fois. Le sous-dossier .cache contient le prompt, le PDF et le texte du manuel ; ils sont réutilisés lors de l'analyse suivante.
vor.arbeitsordnerHinweis.es=Para cada maqueta se crea una subcarpeta con los archivos para el chat; se vuelve a llenar cada vez. En la subcarpeta .cache están el prompt, el PDF y el texto del manual; se reutilizan en el siguiente análisis.
vor.arbeitsordnerHinweis.it=Per ogni plastico viene creata una sottocartella con i file per la chat; viene riempita ogni volta. Nella sottocartella .cache si trovano prompt, PDF e testo del manuale; vengono riutilizzati nell'analisi successiva.

