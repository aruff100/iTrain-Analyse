ergebnis.alleDateien.fr=Tous les fichiers ({0}, {1} Ko) – saisir ici et glisser dans le chat
ergebnis.alleDateien.es=Todos los archivos ({0}, {1} KB) – agarrar aquí y arrastrar al chat
ergebnis.alleDateien.it=Tutti i file ({0}, {1} KB) – afferrare qui e trascinare nella chat

