feld.anfHinweis.de=Anfänger-Modus: Der Prompt arbeitet in Runden. Für jede weitere Runde laden Sie im selben Chat nur die neu gespeicherte .tcdz und ein Bild der Diagnose hoch.
feld.anfHinweis.en=Beginner mode: the prompt works in rounds. For each further round, upload only the newly saved .tcdz and a picture of the diagnostics in the same chat.
feld.anfHinweis.nl=Beginnersmodus: de prompt werkt in rondes. Voor elke volgende ronde uploadt u in dezelfde chat alleen het opnieuw opgeslagen .tcdz-bestand en een afbeelding van de diagnose.
feld.anfHinweis.fr=Mode débutant : le prompt travaille par tours. Pour chaque tour suivant, téléversez dans le même chat seulement le .tcdz enregistré à nouveau et une image du diagnostic.
feld.anfHinweis.es=Modo principiante: el prompt trabaja por rondas. En cada ronda siguiente suba en el mismo chat solo el .tcdz guardado de nuevo y una imagen del diagnóstico.
feld.anfHinweis.it=Modalità principianti: il prompt lavora a turni. Per ogni turno successivo caricate nella stessa chat solo il .tcdz salvato di nuovo e un'immagine della diagnostica.
