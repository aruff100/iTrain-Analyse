kurz.ersparnisUnbekannt.de=Die Ersparnis lässt sich erst berechnen, wenn das Handbuch einmal geladen ist (nur deutsches Handbuch, Handbuch-Auszug eingeschaltet).
kurz.ersparnisUnbekannt.en=The saving can only be calculated once the manual has been loaded (German manual only, manual excerpt switched on).
kurz.ersparnisUnbekannt.nl=De besparing kan pas worden berekend als de handleiding eenmaal is geladen (alleen Duitse handleiding, uittreksel ingeschakeld).
kurz.ersparnisUnbekannt.fr=L'économie ne peut être calculée qu'une fois le manuel chargé (manuel allemand uniquement, extrait activé).
kurz.ersparnisUnbekannt.es=El ahorro solo se puede calcular cuando el manual se ha cargado una vez (solo manual alemán, extracto activado).
kurz.ersparnisUnbekannt.it=Il risparmio si può calcolare solo dopo aver caricato il manuale (solo manuale tedesco, estratto attivato).
