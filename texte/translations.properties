vor.handbuchHinweis.de=Die Seitenangaben im Prompt sind für das deutsche Handbuch geprüft. Bei anderen Sprachfassungen sucht die KI die Seiten selbst. Ein italienisches Handbuch gibt es nicht, dafür wird das englische genommen.
vor.handbuchHinweis.en=The page references in the prompt are verified for the German manual. With other editions the AI looks up the pages itself. There is no Italian manual; the English one is used instead.
vor.handbuchHinweis.nl=De paginaverwijzingen in de prompt zijn gecontroleerd voor de Duitse handleiding. Bij andere taalversies zoekt de AI de pagina's zelf. Er is geen Italiaanse handleiding; daarvoor wordt de Engelse gebruikt.
vor.handbuchHinweis.fr=Les numéros de page du prompt sont vérifiés pour le manuel allemand. Avec les autres éditions, l'IA recherche elle-même les pages. Il n'existe pas de manuel italien ; le manuel anglais est utilisé.
vor.handbuchHinweis.es=Las referencias de página del prompt están verificadas para el manual alemán. Con otras ediciones la IA busca las páginas por sí misma. No existe manual en italiano; se usa el inglés.
vor.handbuchHinweis.it=I riferimenti di pagina del prompt sono verificati per il manuale tedesco. Con altre edizioni l'IA cerca da sola le pagine. Non esiste un manuale italiano; si usa quello inglese.

