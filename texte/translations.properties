anf.titel.de=Anfänger-Modus: So geht es
anf.titel.en=Beginner mode: how it works
anf.titel.nl=Beginnersmodus: zo werkt het
anf.titel.fr=Mode débutant : comment ça marche
anf.titel.es=Modo principiante: cómo funciona
anf.titel.it=Modalità principianti: come funziona
anf.weg.titel.de=So arbeitet der Prompt
anf.weg.titel.en=How the prompt works
anf.weg.titel.nl=Zo werkt de prompt
anf.weg.titel.fr=Comment travaille le prompt
anf.weg.titel.es=Cómo trabaja el prompt
anf.weg.titel.it=Come lavora il prompt
anf.weg.text.de=Der Prompt für Anfänger prüft Ihr Projekt nicht auf einmal, sondern in Runden. Jede Runde behandelt ein Thema, zum Beispiel Rückmelder, Blöcke oder Stopp-Positionen, mit höchstens drei Punkten. Zu jedem Punkt erklärt die KI, was sie gefunden hat, warum es wichtig ist und mit welchen Klicks Sie es in iTrain ändern, mit Seitenangabe im Handbuch. Sie ändern die Punkte, speichern das Projekt und laden die Datei im selben Chat wieder hoch. Die KI prüft dann, was erledigt ist, und nimmt sich das nächste Thema vor. Rote Fehler aus der iTrain-Diagnose haben immer Vorrang.
anf.weg.text.en=The beginner prompt does not check your project all at once but in rounds. Each round deals with one topic, for example feedbacks, blocks or stop positions, with at most three points. For each point the AI explains what it found, why it matters and with which clicks you change it in iTrain, with the page in the manual. You change the points, save the project and upload the file again in the same chat. The AI then checks what has been done and moves on to the next topic. Red errors from the iTrain diagnostics always take priority.
anf.weg.text.nl=De prompt voor beginners controleert uw project niet in één keer, maar in rondes. Elke ronde behandelt één onderwerp, bijvoorbeeld terugmelders, blokken of stopposities, met hoogstens drie punten. Bij elk punt legt de AI uit wat ze gevonden heeft, waarom het belangrijk is en met welke klikken u het in iTrain aanpast, met de pagina in de handleiding. U past de punten aan, slaat het project op en uploadt het bestand opnieuw in dezelfde chat. De AI controleert dan wat opgelost is en neemt het volgende onderwerp. Rode fouten uit de iTrain-diagnose hebben altijd voorrang.
anf.weg.text.fr=Le prompt débutant ne vérifie pas votre projet en une seule fois, mais par tours. Chaque tour traite un thème, par exemple les rétrosignalisations, les cantons ou les positions d'arrêt, avec au plus trois points. Pour chaque point, l'IA explique ce qu'elle a trouvé, pourquoi c'est important et par quels clics le modifier dans iTrain, avec la page du manuel. Vous modifiez les points, enregistrez le projet et téléversez à nouveau le fichier dans le même chat. L'IA vérifie alors ce qui est réglé et passe au thème suivant. Les erreurs rouges du diagnostic d'iTrain sont toujours prioritaires.
anf.weg.text.es=El prompt para principiantes no revisa su proyecto de una vez, sino por rondas. Cada ronda trata un tema, por ejemplo retroseñales, bloques o posiciones de parada, con un máximo de tres puntos. Para cada punto la IA explica lo que ha encontrado, por qué es importante y con qué clics lo cambia en iTrain, con la página del manual. Usted cambia los puntos, guarda el proyecto y vuelve a subir el archivo en el mismo chat. La IA comprueba entonces lo que está resuelto y pasa al siguiente tema. Los errores rojos del diagnóstico de iTrain siempre tienen prioridad.
anf.weg.text.it=Il prompt per principianti non controlla il progetto tutto in una volta, ma a turni. Ogni turno tratta un tema, per esempio retrosegnalazioni, blocchi o posizioni di arresto, con al massimo tre punti. Per ogni punto l'IA spiega che cosa ha trovato, perché è importante e con quali clic lo modificate in iTrain, con la pagina del manuale. Voi modificate i punti, salvate il progetto e caricate di nuovo il file nella stessa chat. L'IA controlla poi che cosa è risolto e passa al tema successivo. Gli errori rossi della diagnostica di iTrain hanno sempre la precedenza.
anf.bereit.titel.de=Das stellt das Programm bereit
anf.bereit.titel.en=What the program provides
anf.bereit.titel.nl=Dit levert het programma
anf.bereit.titel.fr=Ce que fournit le programme
anf.bereit.titel.es=Lo que aporta el programa
anf.bereit.titel.it=Che cosa fornisce il programma
anf.bereit.text.de=Das Programm stellt den Prompt für Anfänger, das iTrain-Handbuch als Text mit Seitenzahlen und Ihre Layout-Datei zusammen. Es legt alles mit dem Text für den Chat in die Zwischenablage und zeigt die Dateien zum Hineinziehen. Release Notes, Direktmodus, Zusätze und Forumsbeitrag gibt es im Anfänger-Modus nicht.
anf.bereit.text.en=The program assembles the beginner prompt, the iTrain manual as text with page numbers and your layout file. It puts everything on the clipboard together with the text for the chat and shows the files for dragging. Release notes, direct mode, extras and forum post are not used in beginner mode.
anf.bereit.text.nl=Het programma stelt de prompt voor beginners, de iTrain-handleiding als tekst met paginanummers en uw layoutbestand samen. Het zet alles samen met de tekst voor de chat op het klembord en toont de bestanden om te slepen. Release notes, directe modus, extra's en forumbericht zijn er in de beginnersmodus niet.
anf.bereit.text.fr=Le programme rassemble le prompt débutant, le manuel iTrain en texte avec numéros de page et votre fichier de réseau. Il place le tout dans le presse-papiers avec le texte pour le chat et affiche les fichiers à glisser. Les notes de version, le mode direct, les compléments et le message du forum ne sont pas utilisés en mode débutant.
anf.bereit.text.es=El programa reúne el prompt para principiantes, el manual de iTrain como texto con números de página y su archivo de maqueta. Lo pone todo en el portapapeles junto con el texto para el chat y muestra los archivos para arrastrarlos. Las notas de la versión, el modo directo, los complementos y la entrada del foro no se usan en el modo principiante.
anf.bereit.text.it=Il programma raccoglie il prompt per principianti, il manuale di iTrain come testo con i numeri di pagina e il vostro file di plastico. Mette tutto negli appunti insieme al testo per la chat e mostra i file da trascinare. Note di rilascio, modalità diretta, supplementi e messaggio del forum non sono usati nella modalità principianti.
anf.brauchen.titel.de=Das brauchen Sie
anf.brauchen.titel.en=What you need
anf.brauchen.titel.nl=Dit heeft u nodig
anf.brauchen.titel.fr=Ce dont vous avez besoin
anf.brauchen.titel.es=Lo que necesita
anf.brauchen.titel.it=Che cosa vi serve
anf.brauchen.text.de=iTrain mit Ihrem Projekt, einen Zugang zu einem KI-Dienst, der Dateien annimmt (geprüft mit Claude), und für einige Punkte einen Zollstock, weil Längen auf der Anlage gemessen werden.
anf.brauchen.text.en=iTrain with your project, access to an AI service that accepts files (tested with Claude), and for some points a folding rule, because lengths are measured on the layout.
anf.brauchen.text.nl=iTrain met uw project, toegang tot een AI-dienst die bestanden aanneemt (getest met Claude), en voor sommige punten een duimstok, omdat lengtes op de baan worden gemeten.
anf.brauchen.text.fr=iTrain avec votre projet, un accès à un service d'IA qui accepte des fichiers (testé avec Claude), et pour certains points un mètre pliant, car des longueurs sont mesurées sur le réseau.
anf.brauchen.text.es=iTrain con su proyecto, acceso a un servicio de IA que acepte archivos (probado con Claude) y, para algunos puntos, un metro plegable, porque se miden longitudes en la maqueta.
anf.brauchen.text.it=iTrain con il vostro progetto, l'accesso a un servizio di IA che accetti file (provato con Claude) e, per alcuni punti, un metro pieghevole, perché si misurano lunghezze sul plastico.
anf.schritte.titel.de=So gehen Sie vor
anf.schritte.titel.en=What you do
anf.schritte.titel.nl=Zo gaat u te werk
anf.schritte.titel.fr=Comment procéder
anf.schritte.titel.es=Cómo proceder
anf.schritte.titel.it=Come procedere
anf.schritt1.de=Layout-Datei und Prompt-Sprache wählen und „{0}“ klicken.
anf.schritt1.en=Choose the layout file and the prompt language and click “{0}”.
anf.schritt1.nl=Kies het layoutbestand en de taal van de prompt en klik op „{0}”.
anf.schritt1.fr=Choisissez le fichier de réseau et la langue du prompt, puis cliquez sur « {0} ».
anf.schritt1.es=Elija el archivo de maqueta y el idioma del prompt y haga clic en «{0}».
anf.schritt1.it=Scegliete il file di plastico e la lingua del prompt e fate clic su «{0}».
anf.schritt2.de=Im KI-Dienst einen neuen, leeren Chat öffnen. Die Dateien aus dem Ergebnisfenster in das Nachrichtenfeld ziehen, den Text mit „{0}“ dazugeben und absenden.
anf.schritt2.en=Open a new, empty chat in the AI service. Drag the files from the result window into the message box, add the text with “{0}” and send.
anf.schritt2.nl=Open in de AI-dienst een nieuwe, lege chat. Sleep de bestanden uit het resultaatvenster in het berichtveld, voeg de tekst toe met „{0}” en verstuur.
anf.schritt2.fr=Ouvrez un nouveau chat vide dans le service d'IA. Glissez les fichiers de la fenêtre de résultat dans le champ de message, ajoutez le texte avec « {0} » et envoyez.
anf.schritt2.es=Abra un chat nuevo y vacío en el servicio de IA. Arrastre los archivos de la ventana de resultado al campo de mensaje, añada el texto con «{0}» y envíe.
anf.schritt2.it=Aprite una chat nuova e vuota nel servizio di IA. Trascinate i file dalla finestra del risultato nel campo del messaggio, aggiungete il testo con «{0}» e inviate.
anf.schritt3.de=Die KI fragt nach der Sprache und danach, wie Ihre Anlage die Züge erkennt. Antworten Sie mit der Nummer.
anf.schritt3.en=The AI asks for the language and then how your layout detects the trains. Answer with the number.
anf.schritt3.nl=De AI vraagt naar de taal en daarna hoe uw baan de treinen herkent. Antwoord met het nummer.
anf.schritt3.fr=L'IA demande la langue, puis comment votre réseau détecte les trains. Répondez par le numéro.
anf.schritt3.es=La IA pregunta por el idioma y después cómo detecta su maqueta los trenes. Responda con el número.
anf.schritt3.it=L'IA chiede la lingua e poi come il vostro plastico rileva i treni. Rispondete con il numero.
anf.schritt4.de=In jeder Runde: die genannten Punkte in iTrain ändern, die Diagnose ausführen (Strg+D, macOS: Cmd+D), das Diagnosefenster groß ziehen, ein Bildschirmfoto machen und das Projekt speichern.
anf.schritt4.en=In every round: change the named points in iTrain, run the diagnostics (Ctrl+D, macOS: Cmd+D), enlarge the diagnostics window, take a screenshot and save the project.
anf.schritt4.nl=In elke ronde: de genoemde punten in iTrain aanpassen, de diagnose uitvoeren (Ctrl+D, macOS: Cmd+D), het diagnosevenster groot trekken, een schermafbeelding maken en het project opslaan.
anf.schritt4.fr=À chaque tour : modifier les points indiqués dans iTrain, lancer le diagnostic (Ctrl+D, macOS : Cmd+D), agrandir la fenêtre du diagnostic, faire une capture d'écran et enregistrer le projet.
anf.schritt4.es=En cada ronda: cambiar en iTrain los puntos indicados, ejecutar el diagnóstico (Ctrl+D, macOS: Cmd+D), agrandar la ventana del diagnóstico, hacer una captura de pantalla y guardar el proyecto.
anf.schritt4.it=A ogni turno: modificare in iTrain i punti indicati, eseguire la diagnostica (Ctrl+D, macOS: Cmd+D), ingrandire la finestra della diagnostica, fare uno screenshot e salvare il progetto.
anf.schritt5.de=Im selben Chat die gespeicherte .tcdz aus Ihrem iTrain-Ordner und das Bildschirmfoto hochladen und mit „1“ antworten. Das Programm brauchen Sie dafür nicht erneut.
anf.schritt5.en=In the same chat, upload the saved .tcdz from your iTrain folder and the screenshot and answer “1”. You do not need the program again for this.
anf.schritt5.nl=Upload in dezelfde chat het opgeslagen .tcdz-bestand uit uw iTrain-map en de schermafbeelding en antwoord met „1”. Het programma heeft u daarvoor niet opnieuw nodig.
anf.schritt5.fr=Dans le même chat, téléversez le .tcdz enregistré depuis votre dossier iTrain et la capture d'écran, puis répondez « 1 ». Vous n'avez pas besoin du programme pour cela.
anf.schritt5.es=En el mismo chat suba el .tcdz guardado de su carpeta de iTrain y la captura de pantalla y responda «1». Para ello no necesita el programa otra vez.
anf.schritt5.it=Nella stessa chat caricate il .tcdz salvato dalla vostra cartella di iTrain e lo screenshot e rispondete «1». Per questo non vi serve di nuovo il programma.
anf.schritt6.de=So geht es Runde für Runde weiter, bis alle Themen erledigt sind. Mit „4“ können Sie jederzeit aufhören und bekommen eine Zusammenfassung.
anf.schritt6.en=This continues round by round until all topics are done. With “4” you can stop at any time and receive a summary.
anf.schritt6.nl=Zo gaat het ronde na ronde verder tot alle onderwerpen klaar zijn. Met „4” kunt u op elk moment stoppen en krijgt u een samenvatting.
anf.schritt6.fr=On continue ainsi tour après tour jusqu'à ce que tous les thèmes soient réglés. Avec « 4 », vous pouvez arrêter à tout moment et recevez un résumé.
anf.schritt6.es=Así se continúa ronda tras ronda hasta completar todos los temas. Con «4» puede parar en cualquier momento y recibe un resumen.
anf.schritt6.it=Si prosegue così turno dopo turno finché tutti i temi sono risolti. Con «4» potete smettere in qualsiasi momento e ricevete un riepilogo.
anf.schritt7.de=Bleiben Sie im selben Chat. In einem neuen Chat müssen Sie alles neu zusammenstellen, und die Prüfung beginnt wieder bei Runde 1.
anf.schritt7.en=Stay in the same chat. In a new chat you have to assemble everything again and the check starts again at round 1.
anf.schritt7.nl=Blijf in dezelfde chat. In een nieuwe chat moet u alles opnieuw samenstellen en begint de controle weer bij ronde 1.
anf.schritt7.fr=Restez dans le même chat. Dans un nouveau chat, il faut tout rassembler à nouveau et la vérification recommence au tour 1.
anf.schritt7.es=Permanezca en el mismo chat. En un chat nuevo tendrá que reunirlo todo de nuevo y la revisión empezará otra vez en la ronda 1.
anf.schritt7.it=Restate nella stessa chat. In una chat nuova dovete ricomporre tutto e il controllo ricomincia dal turno 1.
anf.claude.titel.de=Geprüft mit Claude
anf.claude.titel.en=Tested with Claude
anf.claude.titel.nl=Getest met Claude
anf.claude.titel.fr=Testé avec Claude
anf.claude.titel.es=Probado con Claude
anf.claude.titel.it=Provato con Claude
anf.claude.text.de=Der Prompt wurde mit Claude an einer Testanlage über mehrere Runden geprüft: vom Anlegen der Rückmelder und Blöcke über Stopp-Positionen und Grenzzeichen bis zum Einmessen der Lok. Das Ergebnis war gut. Andere KI-Dienste sollten ebenfalls funktionieren, sind aber nicht geprüft.
anf.claude.text.en=The prompt was tested with Claude on a test layout over several rounds: from creating feedbacks and blocks through stop positions and clearance points to calibrating the locomotive. The result was good. Other AI services should also work but have not been tested.
anf.claude.text.nl=De prompt is met Claude op een testbaan over meerdere rondes getest: van het aanmaken van terugmelders en blokken via stopposities en vrijgavepunten tot het inmeten van de locomotief. Het resultaat was goed. Andere AI-diensten zouden ook moeten werken, maar zijn niet getest.
anf.claude.text.fr=Le prompt a été testé avec Claude sur un réseau d'essai sur plusieurs tours : de la création des rétrosignalisations et des cantons aux positions d'arrêt et points de dégagement jusqu'à l'étalonnage de la locomotive. Le résultat était bon. D'autres services d'IA devraient aussi fonctionner, mais n'ont pas été testés.
anf.claude.text.es=El prompt se probó con Claude en una maqueta de prueba durante varias rondas: desde crear retroseñales y bloques, pasando por posiciones de parada y puntos de despeje, hasta calibrar la locomotora. El resultado fue bueno. Otros servicios de IA deberían funcionar también, pero no se han probado.
anf.claude.text.it=Il prompt è stato provato con Claude su un plastico di prova per diversi turni: dalla creazione di retrosegnalazioni e blocchi, passando per posizioni di arresto e punti di sgombero, fino alla taratura della locomotiva. Il risultato è stato buono. Altri servizi di IA dovrebbero funzionare, ma non sono stati provati.
anf.kosten.titel.de=Kosten und Limits
anf.kosten.titel.en=Costs and limits
anf.kosten.titel.nl=Kosten en limieten
anf.kosten.titel.fr=Coûts et limites
anf.kosten.titel.es=Costes y límites
anf.kosten.titel.it=Costi e limiti
anf.kosten.text.de=Eine Prüfung in Runden verbraucht viel Nutzung, weil das Handbuch groß ist und jede Runde neue Dateien bringt. Mit dem kostenlosen Zugang von Claude funktioniert es, aber das Limit ist schnell erreicht; dann machen Sie nach der Wartezeit im selben Chat weiter. Zügig und ohne lange Unterbrechungen geht es mit einem bezahlten Abo. Die kleinste bezahlte Lösung ist Claude Pro (laut Anthropic 20 US-Dollar im Monat, in Europa in Landeswährung; Stand November 2026). Ein einmaliges Guthaben ohne Abo gibt es im Chat nicht; zusätzliches Guthaben können nur Nutzer eines bezahlten Plans kaufen.
anf.kosten.text.en=A check in rounds uses a lot of usage, because the manual is large and every round brings new files. It works with the free Claude plan, but the limit is reached quickly; then you continue in the same chat after the waiting time. It is quick and without long interruptions with a paid subscription. The smallest paid option is Claude Pro (according to Anthropic 20 US dollars per month, in Europe in local currency; as of November 2026). A one-time credit without a subscription does not exist in the chat; additional credit can only be bought by users of a paid plan.
anf.kosten.text.nl=Een controle in rondes verbruikt veel gebruik, omdat de handleiding groot is en elke ronde nieuwe bestanden brengt. Met de gratis toegang van Claude werkt het, maar de limiet is snel bereikt; dan gaat u na de wachttijd verder in dezelfde chat. Vlot en zonder lange onderbrekingen gaat het met een betaald abonnement. De kleinste betaalde oplossing is Claude Pro (volgens Anthropic 20 Amerikaanse dollar per maand, in Europa in lokale valuta; stand november 2026). Een eenmalig tegoed zonder abonnement bestaat in de chat niet; extra tegoed kunnen alleen gebruikers van een betaald abonnement kopen.
anf.kosten.text.fr=Une vérification par tours consomme beaucoup d'utilisation, car le manuel est volumineux et chaque tour apporte de nouveaux fichiers. Cela fonctionne avec l'accès gratuit de Claude, mais la limite est vite atteinte ; vous continuez alors dans le même chat après le temps d'attente. C'est rapide et sans longues interruptions avec un abonnement payant. La plus petite solution payante est Claude Pro (selon Anthropic 20 dollars américains par mois, en Europe en monnaie locale ; état novembre 2026). Un crédit unique sans abonnement n'existe pas dans le chat ; seuls les utilisateurs d'un abonnement payant peuvent acheter du crédit supplémentaire.
anf.kosten.text.es=Una revisión por rondas consume mucho uso, porque el manual es grande y cada ronda trae archivos nuevos. Funciona con el acceso gratuito de Claude, pero el límite se alcanza pronto; entonces continúe en el mismo chat después del tiempo de espera. Con una suscripción de pago va rápido y sin largas interrupciones. La opción de pago más pequeña es Claude Pro (según Anthropic 20 dólares estadounidenses al mes, en Europa en moneda local; a noviembre de 2026). En el chat no existe un saldo único sin suscripción; solo los usuarios de un plan de pago pueden comprar saldo adicional.
anf.kosten.text.it=Un controllo a turni consuma molto utilizzo, perché il manuale è grande e ogni turno porta nuovi file. Funziona con l'accesso gratuito di Claude, ma il limite si raggiunge presto; allora continuate nella stessa chat dopo il tempo di attesa. Con un abbonamento a pagamento si procede rapidamente e senza lunghe interruzioni. La soluzione a pagamento più piccola è Claude Pro (secondo Anthropic 20 dollari statunitensi al mese, in Europa in valuta locale; situazione novembre 2026). Nella chat non esiste un credito una tantum senza abbonamento; il credito aggiuntivo può essere acquistato solo dagli utenti di un piano a pagamento.
