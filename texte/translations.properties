feld.forumHinweis.de=Das iTrain-Forum zeigt Beiträge nur angemeldeten Nutzern. Die KI kann den Beitrag nur lesen, wenn sie einen Browser benutzen darf, in dem Sie im Forum angemeldet sind (z. B. Claude mit der Erweiterung „Claude in Chrome“ oder dem Browser der Claude-App). Sonst den Text des Beitrags unten einfügen.
feld.forumHinweis.en=The iTrain forum shows posts to logged-in users only. The AI can only read the post if it may use a browser in which you are logged in to the forum (e.g. Claude with the “Claude in Chrome” extension or the browser of the Claude app). Otherwise paste the text of the post below.
feld.forumHinweis.nl=Het iTrain-forum toont berichten alleen aan aangemelde gebruikers. De AI kan het bericht alleen lezen als hij een browser mag gebruiken waarin u op het forum bent aangemeld (bijv. Claude met de extensie „Claude in Chrome” of de browser van de Claude-app). Plak anders de tekst van het bericht hieronder.
feld.forumHinweis.fr=Le forum iTrain n'affiche les messages qu'aux utilisateurs connectés. L'IA ne peut lire le message que si elle peut utiliser un navigateur dans lequel vous êtes connecté au forum (par ex. Claude avec l'extension « Claude in Chrome » ou le navigateur de l'application Claude). Sinon, collez le texte du message ci-dessous.
feld.forumHinweis.es=El foro de iTrain solo muestra los mensajes a usuarios registrados. La IA solo puede leer el mensaje si puede usar un navegador en el que usted haya iniciado sesión en el foro (p. ej. Claude con la extensión «Claude in Chrome» o el navegador de la aplicación Claude). Si no, pegue abajo el texto del mensaje.
feld.forumHinweis.it=Il forum di iTrain mostra i messaggi solo agli utenti connessi. L'IA può leggere il messaggio solo se può usare un browser in cui lei è connesso al forum (ad es. Claude con l'estensione «Claude in Chrome» o il browser dell'app Claude). Altrimenti incolli qui sotto il testo del messaggio.

