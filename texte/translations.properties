kurz.h.ki.it=Che cosa verifica in più l'IA
kurz.wasKi.de=Die ausführliche Analyse mit KI übernimmt die Kurzprüfung, prüft einige Befunde an der Datei nach und ergänzt, was nur die KI kann:\n• Aktionen und Abläufe, z. B. ob Bedingungen und Schritte zusammenpassen\n• Zusammenhänge zwischen Blöcken, Routen, Zügen und Zugoptionen\n• Signale nach den Regeln von Berros (Zusatz 3)\n• Erklärungen mit Handbuchseiten, Lösungsvorschläge und Ihr eigener Auftrag\nSie bekommen ein Analysedokument als Text, BBCode für das Forum, PDF oder RTF.
kurz.wasKi.en=The detailed analysis with AI adopts the quick check, verifies some findings against the file and adds what only the AI can do:\n• actions and sequences, e.g. whether conditions and steps fit together\n• relationships between blocks, routes, trains and train options\n• signals according to the Berros rules (extra 3)\n• explanations with manual pages, proposed solutions and your own task\nYou get an analysis document as text, BBCode for the forum, PDF or RTF.
kurz.wasKi.nl=De uitgebreide analyse met AI neemt de snelle controle over, controleert enkele bevindingen in het bestand en vult aan wat alleen de AI kan:\n• acties en verloop, bijv. of voorwaarden en stappen bij elkaar passen\n• samenhang tussen blokken, routes, treinen en treinopties\n• seinen volgens de regels van Berros (aanvulling 3)\n• uitleg met pagina's uit de handleiding, oplossingen en uw eigen opdracht\nU krijgt een analysedocument als tekst, BBCode voor het forum, PDF of RTF.
kurz.wasKi.fr=L'analyse détaillée avec IA reprend le contrôle rapide, vérifie quelques constats dans le fichier et ajoute ce que seule l'IA peut faire :\n• actions et déroulements, par ex. si les conditions et les étapes concordent\n• liens entre cantons, itinéraires, trains et options des trains\n• signaux selon les règles de Berros (complément 3)\n• explications avec pages du manuel, propositions de solutions et votre propre tâche\nVous obtenez un document d'analyse en texte, BBCode pour le forum, PDF ou RTF.
kurz.wasKi.es=El análisis detallado con IA adopta la comprobación rápida, verifica algunos hallazgos en el archivo y añade lo que solo la IA puede hacer:\n• acciones y secuencias, p. ej. si condiciones y pasos encajan\n• relaciones entre bloques, rutas, trenes y opciones de tren\n• señales según las reglas de Berros (complemento 3)\n• explicaciones con páginas del manual, propuestas de solución y su propia tarea\nObtiene un documento de análisis como texto, BBCode para el foro, PDF o RTF.
kurz.wasKi.it=L'analisi dettagliata con IA riprende la verifica rapida, controlla alcuni rilievi nel file e aggiunge ciò che solo l'IA può fare:\n• azioni e sequenze, ad es. se condizioni e passi concordano\n• relazioni tra blocchi, percorsi, treni e opzioni dei treni\n• segnali secondo le regole di Berros (supplemento 3)\n• spiegazioni con pagine del manuale, proposte di soluzione e il vostro compito\nOttenete un documento di analisi come testo, BBCode per il forum, PDF o RTF.
