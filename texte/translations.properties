haupt.ablauf.de=So geht es weiter: Layout-Datei wählen und „Kurzprüfung starten“. Das Programm prüft die Datei sofort selbst, ohne KI, und zeigt das Ergebnis in einem eigenen Fenster. Dort entscheiden Sie, ob Ihnen die Kurzprüfung reicht oder ob Sie Schritt für Schritt zur ausführlichen Analyse mit KI weitergehen.
haupt.ablauf.en=How it works: choose the layout file and click “Start quick check”. The program checks the file immediately by itself, without AI, and shows the result in a separate window. There you decide whether the quick check is enough or whether you continue step by step to the detailed analysis with AI.
haupt.ablauf.nl=Zo gaat het verder: kies het layoutbestand en klik op „Snelle controle starten”. Het programma controleert het bestand direct zelf, zonder AI, en toont het resultaat in een eigen venster. Daar beslist u of de snelle controle genoeg is of dat u stap voor stap verdergaat naar de uitgebreide analyse met AI.
haupt.ablauf.fr=Déroulement : choisissez le fichier de réseau et cliquez sur « Lancer le contrôle rapide ». Le programme vérifie aussitôt le fichier lui-même, sans IA, et affiche le résultat dans une fenêtre à part. Vous y décidez si le contrôle rapide vous suffit ou si vous passez étape par étape à l'analyse détaillée avec IA.
haupt.ablauf.es=Así sigue: elija el archivo de maqueta y pulse «Iniciar comprobación rápida». El programa comprueba el archivo al instante por sí mismo, sin IA, y muestra el resultado en una ventana propia. Allí decide si le basta la comprobación rápida o si continúa paso a paso con el análisis detallado con IA.
haupt.ablauf.it=Come procedere: scegliete il file del plastico e fate clic su «Avvia verifica rapida». Il programma verifica subito il file da sé, senza IA, e mostra il risultato in una finestra a parte. Lì decidete se la verifica rapida vi basta o se proseguite passo dopo passo con l'analisi dettagliata con IA.
kurz.h.was.de=Was die Kurzprüfung prüft
kurz.h.was.en=What the quick check covers
kurz.h.was.nl=Wat de snelle controle controleert
kurz.h.was.fr=Ce que vérifie le contrôle rapide
kurz.h.was.es=Qué comprueba la comprobación rápida
kurz.h.was.it=Che cosa verifica la verifica rapida
kurz.wasGeprueft.de=Das Programm prüft die Layout-Datei nach festen Regeln, ohne KI und ohne Internet:\n• Rückmelder-Verzögerungen und Adressen von Rückmeldern und Zubehör\n• Block- und Melderlängen, Rückmelder in mehreren Blöcken, Blockverbindungen, Grenzzeichen und Stopp-Positionen\n• Fahrzeuge und Züge (Adressen, Längen, Spurweite, Reaktionsverzögerung)\n• alle Routen: Verbindungen, „Strikt“, Wiederholung, Erlaubnisse, Markierungen, „Kritisch“ mit Wartezeit\n• Bahnsteige, Zugtabelle
kurz.wasGeprueft.en=The program checks the layout file according to fixed rules, without AI and without internet:\n• feedback delays and addresses of feedbacks and accessories\n• block and feedback lengths, feedbacks in several blocks, block connections, clearance points and stop positions\n• vehicles and trains (addresses, lengths, gauge, reaction delay)\n• all routes: connections, “Strict”, repetition, permissions, markers, “Critical” with waiting time\n• platforms, train table
kurz.wasGeprueft.nl=Het programma controleert het layoutbestand volgens vaste regels, zonder AI en zonder internet:\n• vertragingen en adressen van terugmelders en toebehoren\n• blok- en melderlengtes, terugmelders in meerdere blokken, blokverbindingen, vrijbalken en stopposities\n• voertuigen en treinen (adressen, lengtes, spoorwijdte, reactievertraging)\n• alle routes: verbindingen, „Strikt”, herhaling, toestemmingen, markeringen, „Kritisch” met wachttijd\n• perrons, treintabel
kurz.wasGeprueft.fr=Le programme vérifie le fichier de réseau selon des règles fixes, sans IA et sans internet :\n• temporisations et adresses des rétrosignalisations et accessoires\n• longueurs des cantons et détecteurs, détecteurs dans plusieurs cantons, liaisons entre cantons, points de dégagement et positions d'arrêt\n• véhicules et trains (adresses, longueurs, écartement, délai de réaction)\n• tous les itinéraires : liaisons, « Strict », répétition, autorisations, marqueurs, « Critique » avec temps d'attente\n• quais, tableau des trains
kurz.wasGeprueft.es=El programa comprueba el archivo de maqueta según reglas fijas, sin IA y sin internet:\n• retardos y direcciones de retroseñalizadores y accesorios\n• longitudes de bloques y detectores, detectores en varios bloques, conexiones entre bloques, piquetes y posiciones de parada\n• vehículos y trenes (direcciones, longitudes, ancho de vía, retardo de reacción)\n• todas las rutas: conexiones, «Estricto», repetición, permisos, marcadores, «Crítico» con tiempo de espera\n• andenes, tabla de trenes
kurz.wasGeprueft.it=Il programma verifica il file del plastico secondo regole fisse, senza IA e senza internet:\n• ritardi e indirizzi dei sensori di retroazione e degli accessori\n• lunghezze di blocchi e sensori, sensori in più blocchi, collegamenti tra blocchi, picchetti e posizioni di arresto\n• veicoli e treni (indirizzi, lunghezze, scartamento, ritardo di reazione)\n• tutti i percorsi: collegamenti, «Rigoroso», ripetizione, permessi, marcatori, «Critico» con tempo di attesa\n• marciapiedi, tabella dei treni
kurz.signaleHinweis.de=Signale prüft die Kurzprüfung nicht. Das macht nur die KI mit Zusatz 3; dazu im Schritt „Weiter zur KI-Analyse“ den Direktmodus und „Signale prüfen“ wählen.
kurz.signaleHinweis.en=The quick check does not check signals. Only the AI does that with extra 3; for it, choose direct mode and “check signals” in the step “Continue to AI analysis”.
kurz.signaleHinweis.nl=Seinen controleert de snelle controle niet. Dat doet alleen de AI met aanvulling 3; kies daarvoor in de stap „Verder naar AI-analyse” de directe modus en „seinen controleren”.
kurz.signaleHinweis.fr=Le contrôle rapide ne vérifie pas les signaux. Seule l'IA le fait avec le complément 3 ; pour cela, choisissez le mode direct et « vérifier les signaux » à l'étape « Continuer vers l'analyse IA ».
kurz.signaleHinweis.es=La comprobación rápida no comprueba las señales. Solo lo hace la IA con el complemento 3; para ello, elija el modo directo y «comprobar señales» en el paso «Continuar al análisis con IA».
kurz.signaleHinweis.it=La verifica rapida non controlla i segnali. Lo fa solo l'IA con il supplemento 3; per farlo, scegliere la modalità diretta e «verificare i segnali» nel passo «Avanti all'analisi IA».
